<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projets BUT 3 - Bibou</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Roboto Condensed', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: white;
      text-transform: uppercase;
      overflow-x: hidden;
    }

    /* ---- MENU ET EN-TÊTE (inchangés) ---- */
    .header-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      padding-top: 20px;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      height: 200px;
      width: auto;
      filter: drop-shadow(0 0 10px white);
    }

    .top-banner {
      display: flex;
      justify-content: center;
      background: rgba(0, 0, 0, 0.9);
      padding: 20px 40px;
      border-radius: 10px;
      width: 90%;
      max-width: 900px;
    }

    .sub-banner {
      display: flex;
      justify-content: center;
      background: rgba(0, 0, 0, 0.9);
      padding: 15px 40px;
      border-radius: 10px;
      width: 90%;
      max-width: 600px;
      margin-top: 15px;
    }

    nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 60px;
      margin: 0;
      padding: 0;
      justify-content: center;
    }

    .sub-banner nav ul { gap: 30px; }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 14px 24px;
      border-radius: 6px;
      font-size: 1.1rem;
      text-align: center;
      display: inline-block;
      transition: background 0.3s, color 0.3s, transform 0.2s;
    }

    nav ul li a:hover,
    nav ul li a.active {
      background-color: white;
      color: black;
      transform: scale(1.05);
    }

    /* ---- ANIMATION SPECTACULAIRE DE CHANTIER ---- */
    
    /* Fond de type Blueprint (Plan de construction) */
    .construction-zone {
      position: relative;
      margin-top: 400px; /* Laisse de la place au menu */
      height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      overflow: hidden;
      border-top: 5px solid #f39c12;
      border-bottom: 5px solid #f39c12;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
    }

    /* Grille en mouvement pour donner de la profondeur */
    .construction-zone::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, transparent 20%, #121212 90%);
      z-index: 1;
      pointer-events: none;
    }

    /* Rubans de balisage qui défilent */
    .moving-tape {
      position: absolute;
      width: 120%;
      height: 30px;
      background: repeating-linear-gradient(
        45deg,
        #f39c12,
        #f39c12 20px,
        #000 20px,
        #000 40px
      );
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      z-index: 4;
      animation: slide-tape 3s linear infinite;
    }
    .tape-top { top: 20px; transform: rotate(-2deg); }
    .tape-bottom { bottom: 20px; transform: rotate(2deg); }

    @keyframes slide-tape {
      0% { background-position: 0 0; }
      100% { background-position: 56.5px 0; }
    }

    /* Grand engrenage rotatif en fond */
    .giant-gear {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 400px;
      height: 400px;
      margin-top: -200px;
      margin-left: -200px;
      border: 30px dashed rgba(243, 156, 18, 0.1);
      border-radius: 50%;
      z-index: 2;
      animation: spin-gear 20s linear infinite;
    }
    
    .giant-gear::before {
      content: '';
      position: absolute;
      top: 40px; left: 40px; right: 40px; bottom: 40px;
      border: 15px solid rgba(243, 156, 18, 0.05);
      border-radius: 50%;
    }

    @keyframes spin-gear {
      100% { transform: rotate(360deg); }
    }

    /* Grue et balancier */
    .crane-system {
      position: absolute;
      top: -50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
      transform-origin: top center;
      animation: swing-crane 6s ease-in-out infinite alternate;
    }

    /* Câble */
    .cable {
      width: 6px;
      height: 150px;
      background: linear-gradient(90deg, #555, #999, #555);
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    /* Crochet et Panneau */
    .hook-panel {
      background: #1e293b;
      border: 4px solid #f39c12;
      padding: 30px 50px;
      border-radius: 10px;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(243, 156, 18, 0.4);
    }

    /* L'attache du crochet */
    .hook-panel::before {
      content: '';
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 20px;
      border: 6px solid #f39c12;
      border-bottom: none;
      border-radius: 20px 20px 0 0;
    }

    @keyframes swing-crane {
      0% { transform: rotate(-5deg) translateY(-10px); }
      100% { transform: rotate(5deg) translateY(10px); }
    }

    /* Textes dans le panneau */
    .panel-title {
      color: #f39c12;
      font-size: 3rem;
      margin: 0;
      text-shadow: 0 0 10px rgba(243, 156, 18, 0.8);
      letter-spacing: 2px;
    }

    .panel-subtitle {
      color: #e2e8f0;
      font-size: 1.2rem;
      margin: 15px 0 0 0;
      font-weight: normal;
    }

    /* Gyrophares clignotants */
    .warning-light {
      position: absolute;
      top: -15px;
      width: 30px;
      height: 30px;
      background-color: #e74c3c;
      border-radius: 50%;
      animation: flash-light 1s infinite alternate;
    }
    .light-left { left: 20px; }
    .light-right { right: 20px; animation-delay: 0.5s; }

    @keyframes flash-light {
      0% { box-shadow: 0 0 0px #e74c3c, 0 0 0px #e74c3c; opacity: 0.5; }
      100% { box-shadow: 0 -10px 40px 10px #e74c3c, 0 0 20px #ff7979; opacity: 1; background-color: #ff7979; }
    }

    /* Responsive */
    @media screen and (max-width: 768px) {
      .top-banner, .sub-banner { flex-direction: column; padding: 15px; }
      nav ul, .sub-banner nav ul { flex-direction: column; gap: 15px; }
      .logo { height: 150px; }
      .construction-zone { margin-top: 500px; height: 50vh; }
      .panel-title { font-size: 2rem; }
      .giant-gear { width: 300px; height: 300px; margin-top: -150px; margin-left: -150px; }
    }

    @media screen and (max-width: 480px) {
      .logo { height: 120px; }
      .construction-zone { margin-top: 450px; }
      .panel-title { font-size: 1.5rem; }
      .panel-subtitle { font-size: 0.9rem; }
      .hook-panel { padding: 20px; }
    }
  </style>
</head>

<body>

    <div class="logo-container">
      <a href="accueil.html"><img src="logo.png" alt="Logo" class="logo"></a>
    </div>
    
    <header class="top-banner">
      <nav>
        <ul>
          <li><a href="apdm.html">À propos de moi</a></li>
          <li><a href="Projet.html" class="active">Projets</a></li>
          <li><a href="bilan.html">Bilan</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <div class="sub-banner">
      <nav>
        <ul>
          <li><a href="projet.html">BUT 1</a></li>
          <li><a href="but2.html">BUT 2</a></li>
          <li><a href="but3.html" class="active">BUT 3</a></li>
        </ul>
      </nav>
    </div>
  </div>

  <section class="construction-zone">
    
    <div class="moving-tape tape-top"></div>
    <div class="moving-tape tape-bottom"></div>

    <div class="giant-gear"></div>

    <div class="crane-system">
      <div class="cable"></div>
      
      <div class="hook-panel">
        <div class="warning-light light-left"></div>
        <div class="warning-light light-right"></div>
        
        <h2 class="panel-title">⚠️ BUT 3 EN CHANTIER ⚠️</h2>
        <p class="panel-subtitle">Les fondations sont en train d'être coulées.<br>Revenez plus tard pour voir le résultat final !</p>
      </div>
    </div>

  </section>
  
</body>
</html>
